name: validate

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-gate:
    uses: ./.github/workflows/ci-gate.yml
    permissions:
      contents: read
      pull-requests: read

  lint:
    name: Project structure
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip docs-only change
        if: needs.ci-gate.outputs.run_code != 'true'
        run: echo "No code paths changed; skipping."
      - uses: actions/checkout@v4
        if: needs.ci-gate.outputs.run_code == 'true'
      - if: needs.ci-gate.outputs.run_code == 'true'
        run: test -f game/Mistspire.uproject
      - name: Validate JSON config files
        if: needs.ci-gate.outputs.run_code == 'true'
        run: |
          set -euo pipefail
          for f in game/Mistspire.uproject interaction_profiles/openxr/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

  shellcheck:
    name: Shellcheck
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip docs-only change
        if: needs.ci-gate.outputs.run_code != 'true'
        run: echo "No code paths changed; skipping."
      - uses: actions/checkout@v4
        if: needs.ci-gate.outputs.run_code == 'true'
      # -x follows `# shellcheck source=` includes (e.g. scripts/lib/ue-paths.sh).
      - if: needs.ci-gate.outputs.run_code == 'true'
        run: shellcheck -x setup.sh run.sh scripts/*.sh

  python-lint:
    name: Python lint (ruff)
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip docs-only change
        if: needs.ci-gate.outputs.run_code != 'true'
        run: echo "No code paths changed; skipping."
      - uses: actions/checkout@v4
        if: needs.ci-gate.outputs.run_code == 'true'
      - uses: actions/setup-python@v5
        if: needs.ci-gate.outputs.run_code == 'true'
        with:
          python-version: "3.11"
      - if: needs.ci-gate.outputs.run_code == 'true'
        run: pip install "ruff==0.16.0"
      - if: needs.ci-gate.outputs.run_code == 'true'
        run: ruff check scripts/*.py .github/scripts/*.py

  xr-sandbox-build:
    name: Build xr-sandbox (native, no Unreal Editor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Placeholder so a required check with this name cannot hang. cmake for native/xr-sandbox runs in CodeQL Analyze (cpp) only when the CI gate sets run_code=true, not on docs-only PRs."
