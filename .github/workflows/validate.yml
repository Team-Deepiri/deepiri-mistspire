name: validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_code: ${{ steps.filter.outputs.run_code }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/pr_has_code_changes.py

  lint:
    name: Project structure
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip docs-only change
        if: needs.ci-gate.outputs.run_code != 'true'
        run: echo "No code paths changed; skipping."
      - uses: actions/checkout@v4
        if: needs.ci-gate.outputs.run_code == 'true'
      - if: needs.ci-gate.outputs.run_code == 'true'
        run: test -f game/Mistspire.uproject
      - name: Validate JSON config files
        if: needs.ci-gate.outputs.run_code == 'true'
        run: |
          set -euo pipefail
          for f in game/Mistspire.uproject interaction_profiles/openxr/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

  shellcheck:
    name: Shellcheck
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip docs-only change
        if: needs.ci-gate.outputs.run_code != 'true'
        run: echo "No code paths changed; skipping."
      - uses: actions/checkout@v4
        if: needs.ci-gate.outputs.run_code == 'true'
      # -x follows `# shellcheck source=` includes (e.g. scripts/lib/ue-paths.sh).
      - if: needs.ci-gate.outputs.run_code == 'true'
        run: shellcheck -x scripts/*.sh

  python-lint:
    name: Python lint (ruff)
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip docs-only change
        if: needs.ci-gate.outputs.run_code != 'true'
        run: echo "No code paths changed; skipping."
      - uses: actions/checkout@v4
        if: needs.ci-gate.outputs.run_code == 'true'
      - uses: actions/setup-python@v5
        if: needs.ci-gate.outputs.run_code == 'true'
        with:
          python-version: "3.11"
      - if: needs.ci-gate.outputs.run_code == 'true'
        run: pip install "ruff==0.16.0"
      - if: needs.ci-gate.outputs.run_code == 'true'
        run: ruff check scripts/*.py .github/scripts/*.py
