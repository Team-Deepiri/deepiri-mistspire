name: CodeQL

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_code: ${{ steps.filter.outputs.run_code }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/pr_has_code_changes.py

  analyze:
    name: Analyze (cpp)
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip docs-only change
        if: needs.ci-gate.outputs.run_code != 'true'
        run: echo "No code paths changed; skipping CodeQL."
      - name: Checkout repository
        if: needs.ci-gate.outputs.run_code == 'true'
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        if: needs.ci-gate.outputs.run_code == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          config-file: ./.github/codeql/codeql-config.yml

      - name: Install OpenXR dev headers
        if: needs.ci-gate.outputs.run_code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenxr-dev pkg-config

      - name: Configure native sandbox
        if: needs.ci-gate.outputs.run_code == 'true'
        run: cmake -B native/xr-sandbox/build -S native/xr-sandbox -DCMAKE_BUILD_TYPE=Release

      - name: Build native sandbox
        if: needs.ci-gate.outputs.run_code == 'true'
        run: cmake --build native/xr-sandbox/build

      - name: Perform CodeQL Analysis
        if: needs.ci-gate.outputs.run_code == 'true'
        uses: github/codeql-action/analyze@v3
