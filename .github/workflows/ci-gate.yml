name: CI gate

on:
  workflow_call:
    outputs:
      run_code:
        description: true when code jobs should run
        value: ${{ jobs.gate.outputs.run_code }}

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_code: ${{ steps.filter.outputs.run_code }}
    steps:
      - id: filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCRIPT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/pr_has_code_changes.py?ref=${SCRIPT_REF}" \
            --jq .content \
            | python3 -c "import sys, base64; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" \
            > /tmp/pr_has_code_changes.py; then
            echo "Failed to fetch gate script; running code jobs." >&2
            echo "run_code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python3 /tmp/pr_has_code_changes.py || {
            echo "Gate script exited non-zero; running code jobs." >&2
            echo "run_code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          }
